# ClickHouse Sink Configuration Example
# ------------------------------------------------------------------------------
# This demonstrates how to configure Vector to send log data to ClickHouse
# using both JSON and efficient RowBinary formats.

data_dir: "/var/lib/vector"

# Source: Ingest data by tailing log files
sources:
  app_logs:
    type: "file"
    include: ["/var/log/app/*.log"]
    ignore_older_secs: 86400 # 1 day

  syslog:
    type: "syslog"
    mode: "tcp"
    address: "0.0.0.0:514"

# Transform: Parse and structure the data
transforms:
  parse_logs:
    type: "remap"
    inputs: ["app_logs"]
    source: |
      .timestamp = now()
      .host = get_hostname()
      .severity = match(.level, {
        "ERROR" => "error",
        "WARN" => "warning",
        "INFO" => "info",
        "DEBUG" => "debug",
        _ => "unknown"
      })

# Sinks: Send data to ClickHouse
sinks:
  # Example 1: JSON format (default, backwards compatible)
  clickhouse_json:
    type: "clickhouse"
    inputs: ["parse_logs"]
    endpoint: "http://localhost:8123"
    database: "logs"
    table: "application_logs"
    format: "json_each_row"  # Options: json_each_row, json_as_object, json_as_string
    compression: "gzip"
    date_time_best_effort: true
    skip_unknown_fields: true
    batch:
      max_bytes: 10485760  # 10MB
      timeout_secs: 30
    auth:
      user: "default"
      password: "password"
    tls:
      enabled: false
    request:
      timeout_secs: 60
      retry_attempts: 3

  # Example 2: RowBinary format (efficient binary encoding with schema)
  clickhouse_rowbinary:
    type: "clickhouse"
    inputs: ["parse_logs"]
    endpoint: "http://localhost:8123"
    database: "logs"
    table: "application_logs_binary"
    format: "row_binary_with_names_and_types"
    compression: "gzip"
    date_time_best_effort: true
    schema:
      # Required columns that must exist in the ClickHouse table
      required_columns:
        - "timestamp"
        - "host"
        - "message"
      # Behavior when event field is missing
      on_missing_field: "use_default"  # Options: use_default, drop_event, insert_null
      # Default values for missing fields
      defaults:
        severity: "info"
        status_code: "0"
    batch:
      max_bytes: 10485760  # 10MB
      timeout_secs: 30
    auth:
      user: "default"
      password: "password"
    tls:
      enabled: false
    request:
      timeout_secs: 60
      retry_attempts: 3

  # Example 3: ClickHouse with async inserts (for high-throughput scenarios)
  clickhouse_async:
    type: "clickhouse"
    inputs: ["parse_logs"]
    endpoint: "http://localhost:8123"
    database: "logs"
    table: "application_logs_async"
    format: "json_each_row"
    compression: "gzip"
    query_settings:
      async_insert_settings:
        # Enable async inserts for better performance
        wait_for_async_insert: 1
        wait_for_async_insert_timeout: 200  # milliseconds
        async_insert_max_data_size: 10485760  # 10MB
    batch:
      max_bytes: 10485760
      timeout_secs: 5  # Shorter timeout since async inserts handle batching
    auth:
      user: "default"
      password: "password"

  # Example 4: ClickHouse with distributed table support
  clickhouse_distributed:
    type: "clickhouse"
    inputs: ["parse_logs"]
    endpoint: "http://localhost:8123"
    database: "logs"
    table: "distributed_logs"
    format: "json_each_row"
    compression: "gzip"
    insert_random_shard: true  # Insert into random shard for distributed tables
    batch:
      max_bytes: 10485760
      timeout_secs: 30
    auth:
      user: "default"
      password: "password"





